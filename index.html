<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试训练 - Apple Music Style</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#fbfbfd',
                            surface: 'rgba(255, 255, 255, 0.75)',
                            border: 'rgba(0, 0, 0, 0.05)',
                            text: '#1d1d1f',
                            subtext: '#86868b',
                            primary: '#fa243c', /* Apple Music Pink/Red */
                            primaryHover: '#d9182d',
                            blue: '#0066cc',
                            green: '#34c759'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                    },
                    boxShadow: {
                        'apple': '0 4px 24px rgba(0, 0, 0, 0.04)',
                        'apple-lg': '0 12px 32px rgba(0, 0, 0, 0.08)',
                        'apple-hover': '0 16px 40px rgba(0, 0, 0, 0.12)' /* 苹果悬浮卡片阴影 */
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- React Router DOM -->
    <script crossorigin src="https://unpkg.com/@remix-run/router@1.15.3/dist/router.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router@6.22.3/dist/umd/react-router.production.min.js"></script>
    <script crossorigin
        src="https://unpkg.com/react-router-dom@6.22.3/dist/umd/react-router-dom.production.min.js"></script>

    <!-- Recharts -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.12.3/umd/Recharts.js"></script>

    <!-- Babel (Stand-alone for JSX compilation in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-apple-bg text-apple-text antialiased min-h-screen font-sans">
    <div id="root"></div>

    <!-- App JSX Script -->
    <script type="text/babel" src="app.jsx"></script>
</body>

</html>
